# Конфиг сборки для Amvera (amvera.ru). Положить в корень того, что
# Amvera билдит для сервиса PocketBase — т.е. указать в настройках
# проекта путь сборки `pocketbase/` (или вынести этот каталог в
# отдельный репозиторий).
#
# Если Amvera-проект настраивается через веб-панель — эти же три
# параметра выставляются там руками:
#   • Окружение / Environment: Docker
#   • Персистентный диск смонтировать в /data
#   • Порт контейнера / Container port: 8080
#
# Точные ключи amvera.yml сверяйте с актуальной докой Amvera —
# формат менялся. Надёжная часть — Dockerfile рядом.
meta:
  environment: docker
build:
  dockerfile: ./Dockerfile
run:
  persistenceMount: /data
  containerPort: 8080
